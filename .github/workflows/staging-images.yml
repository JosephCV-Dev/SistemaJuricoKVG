name: Validar paquete de staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images-and-https:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:staging
      - run: npm run test:staging:https
